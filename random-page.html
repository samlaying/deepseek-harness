<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random Page</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #141e30, #243b55);
      color: white;
    }
    main {
      width: min(680px, calc(100vw - 40px));
      padding: 40px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(16px);
    }
    h1 { margin-top: 0; font-size: 42px; }
    p { line-height: 1.7; color: rgba(255, 255, 255, 0.86); }
    .badge {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      font-size: 14px;
      margin-bottom: 18px;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">Generated HTML</span>
    <h1>你好，这是一个随机页面</h1>
    <p>这个 HTML 文件由 Agent 生成。它包含简单的响应式布局、渐变背景、玻璃拟态卡片和一点点中文内容。</p>
    <p>你可以直接用浏览器打开它，也可以继续让我修改样式、加按钮、动画或交互。</p>
  </main>
</body>
</html>
