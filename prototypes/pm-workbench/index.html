<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PM Workbench — 信息架构比较</title>
  <style>
    :root {
      --ink: #e8eee9;
      --muted: #93a39a;
      --line: #26372f;
      --paper: #111a16;
      --canvas: #07100c;
      --forest: #0b1511;
      --mint: #dff4e6;
      --mint-strong: #2f8f66;
      --yellow: #fff1bf;
      --purple: #e9e5ff;
      --coral: #ffe3dc;
      --shadow: 0 20px 60px rgba(0, 0, 0, .35);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: radial-gradient(circle at 50% -10%, #1a3428 0, var(--canvas) 42%); color: var(--ink); font: 14px/1.45 Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    button { font: inherit; color: inherit; cursor: pointer; }
    .app { width: min(1440px, calc(100vw - 32px)); height: min(880px, calc(100vh - 92px)); min-height: 660px; margin: 28px auto 64px; overflow: hidden; border: 1px solid #294238; border-radius: 18px; background: var(--paper); box-shadow: var(--shadow); }
    .topbar { height: 58px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; color: #f4f7f4; background: var(--forest); }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 700; letter-spacing: -.02em; }
    .logo { display: grid; width: 28px; height: 28px; place-items: center; color: var(--forest); background: #b9f1c9; border-radius: 9px; font-size: 15px; }
    .crumb { display: flex; align-items: center; gap: 9px; color: #d6e2da; font-size: 12px; }
    .crumb strong { color: #fff; font-weight: 600; }
    .workspace { height: calc(100% - 58px); display: flex; min-width: 0; }
    .sidebar { width: 264px; flex: 0 0 264px; padding: 18px 12px; border-right: 1px solid var(--line); background: #0d1712; }
    .smallcaps { color: #7d8982; font-size: 10px; font-weight: 800; letter-spacing: .1em; }
    .project-title { margin: 8px 8px 16px; font-size: 16px; font-weight: 750; letter-spacing: -.025em; }
    .nav-item { width: 100%; display: flex; align-items: center; gap: 9px; margin: 3px 0; padding: 9px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; color: #48534d; }
    .nav-item:hover, .nav-item.active { background: #e6f3e9; color: #183d30; font-weight: 650; }
    .nav-dot { width: 8px; height: 8px; border-radius: 50%; background: #a5b3aa; }
    .nav-item.active .nav-dot { background: var(--mint-strong); box-shadow: 0 0 0 4px #c9eed5; }
    .nav-count { margin-left: auto; color: #89948e; font-size: 11px; }
    .subnav { margin: 20px 8px 7px; }
    .side-note { margin: 28px 6px 0; padding: 12px; border: 1px solid #d9e7dc; border-radius: 10px; color: #436052; background: #eef8f1; font-size: 12px; }
    .side-note strong { display: block; margin-bottom: 4px; color: #204837; }
    .tree-label { display: flex; align-items: center; gap: 6px; margin: 12px 8px 3px; color: #7d8982; font-size: 10px; font-weight: 800; letter-spacing: .08em; }
    .tree-row { display: flex; align-items: center; gap: 7px; margin: 2px 0; padding: 7px 8px; border-radius: 7px; color: #58655e; font-size: 12px; }
    .tree-row.indent { margin-left: 13px; padding-left: 12px; border-left: 1px solid #d4ded5; }
    .tree-row.selected { color: #173c31; background: #dff4e6; font-weight: 700; }
    .tree-row .tree-icon { width: 14px; color: #769184; text-align: center; font-size: 11px; }
    .tree-row .tree-meta { margin-left: auto; color: #89958d; font-size: 10px; }
    .main { min-width: 0; flex: 1; overflow: auto; background: #111a16; }
    .doc { max-width: 840px; margin: 0 auto; padding: 34px 44px 100px; }
    .eyebrow { display: flex; align-items: center; gap: 8px; color: #5f7066; font-size: 12px; }
    .pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border: 1px solid #cfe0d4; border-radius: 999px; color: #32604a; background: #f0faf3; font-size: 11px; font-weight: 700; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #54ad78; }
    h1 { margin: 14px 0 8px; font-size: 28px; line-height: 1.22; letter-spacing: -.055em; }
    h2 { margin: 32px 0 12px; font-size: 16px; letter-spacing: -.025em; }
    .lead { max-width: 700px; margin: 0; color: var(--muted); font-size: 14px; }
    .state-ribbon { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; margin-top: 26px; overflow: hidden; border: 1px solid var(--line); border-radius: 11px; background: var(--line); }
    .state { min-height: 78px; padding: 12px; background: #fff; }
    .state b { display: block; margin-bottom: 4px; font-size: 12px; }
    .state span { color: var(--muted); font-size: 11px; }
    .state.ok b::before, .state.warn b::before, .state.todo b::before, .state.hold b::before { display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; content: ""; }
    .state.ok b::before { background: #48a871; }.state.warn b::before { background: #e8aa3f; }.state.todo b::before { background: #8a8fb3; }.state.hold b::before { background: #c56d67; }
    .needs { display: grid; gap: 10px; }
    .need { display: grid; grid-template-columns: 25px 1fr; gap: 10px; padding: 13px; border: 1px solid #e4e8e3; border-radius: 10px; background: #fcfdfb; }
    .need-num { display: grid; width: 24px; height: 24px; place-items: center; color: #2c7653; background: var(--mint); border-radius: 7px; font-size: 11px; font-weight: 800; }
    .need strong { display: block; font-size: 13px; }.need p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .directions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .direction { position: relative; padding: 16px; border: 1px solid #dce5dc; border-radius: 12px; background: #fff; text-align: left; transition: .18s ease; }
    .direction:hover, .direction.selected { border-color: #6ec18e; box-shadow: 0 8px 20px rgba(40, 125, 76, .11); transform: translateY(-1px); }
    .direction-tag { display: inline-block; margin-bottom: 9px; padding: 3px 7px; border-radius: 5px; background: var(--purple); color: #4e467a; font-size: 10px; font-weight: 800; }.direction:nth-child(2) .direction-tag { background: var(--yellow); color: #775e14; }
    .direction h3 { margin: 0 0 6px; font-size: 14px; }.direction p { margin: 0; color: var(--muted); font-size: 12px; }.direction .risk { display: block; margin-top: 10px; color: #915d37; font-size: 11px; }
    .agent { width: 310px; flex: 0 0 310px; padding: 16px; border-left: 1px solid var(--line); background: #0d1712; transition: width .22s ease, padding .22s ease; }
    .agent.hidden { width: 0; flex-basis: 0; padding: 16px 0; overflow: hidden; border-left: 0; }
    .agent-header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
    .agent-header b { font-size: 13px; }.icon-btn { display: grid; width: 27px; height: 27px; place-items: center; border: 1px solid #d6ded7; border-radius: 7px; background: #fff; color: #607067; }
    .agent-intro { margin: 14px 0; padding: 12px; border-radius: 10px; color: #315543; background: #edf8f0; font-size: 12px; }.agent-intro b { display: block; margin-bottom: 3px; }
    .agent-list { display: grid; gap: 8px; }.agent-task { padding: 11px 10px; border: 1px solid #e0e7e1; border-radius: 9px; background: #fff; }.agent-task small { display: block; color: #7b887f; font-size: 10px; }.agent-task strong { display: block; margin-top: 3px; font-size: 12px; }.agent-task p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
    .agent-action { width: 100%; margin-top: 14px; padding: 9px; border: 1px solid #255f43; border-radius: 8px; color: #fff; background: #266547; font-weight: 650; font-size: 12px; }
    .agent-output { display: none; margin-top: 10px; padding: 10px; border-radius: 8px; color: #3f5f4e; background: #f1f5f0; font-size: 11px; }.agent-output.show { display: block; }
    .chat-feed { display: grid; gap: 9px; margin: 13px 0; max-height: 280px; overflow: auto; }
    .chat-line { padding: 9px 10px; border-radius: 9px; background: #f2f6f2; color: #4e5f54; font-size: 11px; }
    .chat-line.user { background: #e4f5e9; color: #28533d; }
    .chat-line b { display: block; margin-bottom: 3px; color: #2b6e4c; font-size: 10px; }
    .chat-compose { display: flex; gap: 6px; align-items: flex-end; margin-top: 10px; }
    .chat-compose textarea { width: 100%; min-height: 55px; resize: vertical; padding: 8px; border: 1px solid #d6e0d7; border-radius: 8px; outline: none; background: #fff; color: var(--ink); font: inherit; font-size: 11px; }
    .chat-compose textarea:focus { border-color: #63ad7f; box-shadow: 0 0 0 3px #e2f4e7; }
    .chat-send { width: 42px; height: 34px; border: 0; border-radius: 8px; color: #fff; background: #266547; font-weight: 700; }
    .run-rail { display: flex; align-items: center; gap: 5px; margin: 22px 0 28px; overflow: auto; white-space: nowrap; }
    .run-step { display: inline-flex; align-items: center; gap: 6px; padding: 7px 9px; border: 1px solid #dce5dd; border-radius: 8px; color: #7b887f; background: #fff; font-size: 11px; }
    .run-step.done { color: #276447; border-color: #b8ddc3; background: #edf8f0; }.run-step.active { color: #fff; border-color: #245f43; background: #266547; font-weight: 700; }.run-arrow { color: #a7b2aa; }
    .run-input { padding: 16px; border: 1px solid #dce6dd; border-radius: 12px; background: #fbfdfb; }.run-input label { display: block; margin-bottom: 8px; color: #718078; font-size: 10px; font-weight: 800; letter-spacing: .08em; }.run-input p { margin: 0; font-size: 14px; line-height: 1.55; }.run-meta { display: flex; gap: 7px; margin-top: 12px; color: #77847b; font-size: 11px; }.run-meta span { padding: 3px 7px; border-radius: 5px; background: #eef3ee; }
    .plan-box { margin-top: 16px; padding: 17px; border: 1px solid #cfe1d3; border-radius: 12px; background: #f4fbf5; }.plan-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }.plan-head h3 { margin: 0; font-size: 15px; }.plan-head small { color: #5e7466; font-size: 10px; }.plan-copy { margin: 9px 0 14px; color: #52655a; font-size: 12px; }.plan-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }.agent-job { padding: 11px; border: 1px solid #dbe7dc; border-radius: 9px; background: #fff; }.agent-job b { display: block; font-size: 12px; }.agent-job span { display: block; margin-top: 4px; color: #6b796f; font-size: 11px; }.agent-job em { display: inline-block; margin-top: 7px; padding: 2px 6px; border-radius: 4px; color: #4b6b56; background: #e8f5eb; font-size: 10px; font-style: normal; }.agent-job.pending em { color: #79622d; background: #fff1c9; }.plan-actions { display: flex; gap: 8px; margin-top: 14px; }.plan-actions button { padding: 8px 11px; border: 1px solid #b9d6bf; border-radius: 7px; background: #fff; color: #286046; font-size: 11px; font-weight: 650; }.plan-actions .primary { color: #fff; border-color: #266547; background: #266547; }
    .synthesis-box { margin-top: 18px; padding: 15px; border: 1px solid #e3dfc9; border-radius: 11px; background: #fffaf0; }.synthesis-box h3 { margin: 0 0 8px; font-size: 13px; }.synthesis-box p { margin: 0; color: #6d6548; font-size: 12px; }.persist-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }.persist-row button { padding: 7px 9px; border: 1px solid #d9d5bd; border-radius: 7px; background: #fff; color: #6b5d29; font-size: 11px; }

    /* Variant 2: Conversation-first */
    .conversation-layout { display: grid; grid-template-columns: 210px minmax(0, 1fr) 300px; height: 100%; }
    .thread-nav { padding: 20px 14px; border-right: 1px solid var(--line); background: #f7f9f7; }.thread-nav h2 { margin: 6px 4px 18px; font-size: 15px; }.thread-step { position: relative; margin: 0 0 5px 12px; padding: 8px 6px 14px 22px; color: #68746d; font-size: 12px; }.thread-step::before { position: absolute; top: 10px; left: 0; width: 9px; height: 9px; border: 2px solid #c9d2cc; border-radius: 50%; background: #fff; content: ""; }.thread-step::after { position: absolute; top: 21px; left: 4px; width: 2px; height: calc(100% - 3px); background: #dce4dd; content: ""; }.thread-step:last-child::after { display: none; }.thread-step.done::before { border-color: #4aa675; background: #4aa675; }.thread-step.active { color: #173d2f; font-weight: 700; }.thread-step.active::before { border-color: #255f43; box-shadow: 0 0 0 4px #d5f0df; }
    .mini-context { margin: 10px 4px 18px; padding: 9px; border: 1px solid #dce5dd; border-radius: 8px; color: #496052; background: #fff; font-size: 10px; line-height: 1.6; }.mini-context b { display: block; color: #204b37; font-size: 11px; }
    .conversation { min-width: 0; overflow: auto; padding: 28px 8%; background: #fff; }.chat-title { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 24px; }.chat-title h1 { margin: 4px 0 0; font-size: 24px; }.chat-title p { margin: 4px 0; color: var(--muted); font-size: 12px; }.msg { display: flex; gap: 10px; max-width: 680px; margin: 15px 0; }.avatar { display: grid; width: 28px; height: 28px; flex: 0 0 28px; place-items: center; border-radius: 9px; color: #fff; background: #2d7552; font-size: 11px; font-weight: 800; }.msg.user { margin-left: 38px; }.msg.user .avatar { order: 2; color: #57645d; background: #e8ece8; }.bubble { padding: 11px 13px; border-radius: 4px 12px 12px; background: #f2f6f2; color: #29342e; font-size: 13px; }.msg.user .bubble { border-radius: 12px 4px 12px 12px; background: #e3f5e9; }.bubble p { margin: 0; }.plan-card { margin: 8px 0 0; padding: 12px; border: 1px solid #d7e5db; border-radius: 9px; background: #fff; }.plan-card strong { display: block; font-size: 12px; }.plan-card ul { margin: 7px 0 0; padding-left: 17px; color: #5b6d62; font-size: 11px; }.chat-actions { display: flex; flex-wrap: wrap; gap: 7px; margin: 14px 0 0 38px; }.chat-actions button { padding: 7px 9px; border: 1px solid #cfddd2; border-radius: 7px; background: #fff; color: #2c6347; font-size: 11px; }.chat-actions button:hover { background: #edf8f0; }
    .draft-panel { padding: 20px 14px; border-left: 1px solid var(--line); background: #fbfcfa; }.draft-panel h2 { margin: 7px 0 14px; font-size: 15px; }.mini-doc { padding: 14px; border: 1px solid #dce4dc; border-radius: 11px; background: #fff; box-shadow: 0 5px 14px rgba(40, 60, 47, .04); }.mini-doc h3 { margin: 0 0 10px; font-size: 13px; }.mini-row { display: flex; gap: 7px; padding: 8px 0; border-top: 1px solid #edf0ed; color: #56655c; font-size: 11px; }.mini-key { flex: 0 0 48px; color: #879189; font-weight: 700; }.insight { margin-top: 16px; padding: 12px; border-radius: 9px; color: #684e22; background: #fff5d6; font-size: 11px; }.insight b { display: block; margin-bottom: 4px; }

    /* Variant 3: Canvas-first */
    .canvas-layout { display: grid; grid-template-columns: 230px minmax(0, 1fr) 290px; height: 100%; }.canvas-left { padding: 18px 14px; border-right: 1px solid var(--line); background: #f7f9f7; }.canvas-left h2 { margin: 7px 5px 14px; font-size: 15px; }.legend { display: grid; gap: 9px; margin: 0 5px; }.legend-item { display: flex; align-items: center; gap: 8px; color: #58665e; font-size: 12px; }.legend-swatch { width: 12px; height: 12px; border-radius: 4px; }.canvas-hint { margin: 25px 5px; padding: 11px; border-left: 3px solid #7ec79c; color: #56675d; background: #eef7f0; font-size: 11px; }
    .mind-canvas { position: relative; overflow: hidden; background: radial-gradient(circle at 72% 18%, #fbfffb 0 8%, transparent 35%), linear-gradient(135deg, #f6f9f5, #edf3ed); }.mind-canvas::before { position: absolute; inset: 0; opacity: .55; background-image: radial-gradient(#c8d5ca 1px, transparent 1px); background-size: 20px 20px; content: ""; }.canvas-top { position: absolute; z-index: 2; top: 22px; left: 28px; right: 28px; display: flex; justify-content: space-between; align-items: center; }.canvas-top h1 { margin: 0; font-size: 22px; }.canvas-top p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }.zoom { display: flex; gap: 5px; }.zoom button { width: 28px; height: 28px; border: 1px solid #d5ddd6; border-radius: 7px; background: #fff; }
    .links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }.link { fill: none; stroke: #b7cbbb; stroke-width: 2; }.link.hot { stroke: #53aa77; stroke-width: 3; }
    .node { position: absolute; z-index: 1; width: 170px; padding: 13px; border: 1px solid #d5dfd6; border-radius: 12px; background: rgba(255,255,255,.94); box-shadow: 0 8px 20px rgba(37, 69, 48, .07); text-align: left; transition: .18s ease; }.node:hover, .node.selected { border-color: #4daf75; box-shadow: 0 12px 25px rgba(37, 104, 66, .16); transform: translateY(-2px); }.node small { display: block; margin-bottom: 5px; color: #78847d; font-size: 10px; font-weight: 800; letter-spacing: .06em; }.node strong { display: block; font-size: 13px; }.node span { display: block; margin-top: 4px; color: #69766f; font-size: 11px; }.node.capacity { top: 152px; left: 9%; background: #f4f2ff; }.node.scene { top: 335px; left: 12%; background: #fffaf0; }.node.need-node { top: 234px; left: 38%; width: 190px; background: #fff; }.node.direction-a { top: 128px; right: 10%; background: #ebf8ef; }.node.direction-b { top: 373px; right: 8%; background: #fff2ec; }.node.question { top: 544px; left: 44%; width: 185px; background: #fff8d9; }
    .inspector { padding: 20px 14px; border-left: 1px solid var(--line); background: #fbfcfa; }.inspector h2 { margin: 7px 0 14px; font-size: 15px; }.inspect-card { padding: 14px; border: 1px solid #dce4dc; border-radius: 11px; background: #fff; }.inspect-card small { color: #718078; font-size: 10px; font-weight: 800; letter-spacing: .08em; }.inspect-card h3 { margin: 6px 0; font-size: 15px; }.inspect-card p { margin: 0; color: #627067; font-size: 12px; }.inspect-list { display: grid; gap: 8px; margin-top: 14px; }.inspect-list div { padding: 9px; border-radius: 8px; background: #f2f6f2; color: #53645a; font-size: 11px; }.inspect-list b { display: block; color: #224a37; font-size: 11px; }

    /* Variant picker — persistent and intentionally separate from the prototype. */
    #variant-picker { display: none; position: fixed; z-index: 20; left: 50%; bottom: 18px; transform: translateX(-50%); align-items: center; gap: 4px; padding: 5px; border: 1px solid rgba(37, 55, 44, .12); border-radius: 12px; background: rgba(255,255,255,.92); box-shadow: 0 12px 32px rgba(21, 39, 28, .16); backdrop-filter: blur(12px); }
    #variant-picker button { min-width: 74px; padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; color: #617067; font-size: 12px; }
    #variant-picker button[aria-pressed="true"] { color: #fff; background: #245e43; font-weight: 700; }
    #variant-picker .hint { padding: 0 8px; color: #849087; font-size: 10px; }
    .variant-kicker { position: fixed; z-index: 19; top: 14px; left: 50%; transform: translateX(-50%); padding: 5px 9px; border-radius: 999px; color: #607066; background: rgba(255,255,255,.72); font-size: 11px; }
    @media (max-width: 980px) { .app { width: calc(100vw - 20px); height: calc(100vh - 72px); margin-top: 16px; }.agent { width: 270px; flex-basis: 270px; }.conversation-layout { grid-template-columns: 165px minmax(0, 1fr) 270px; }.draft-panel, .canvas-left { display: none; }.canvas-layout { grid-template-columns: minmax(0, 1fr) 255px; }.doc { padding: 28px 26px 80px; }.state-ribbon { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 480px) { .topbar { padding: 0 13px; }.crumb { display: none; }.sidebar, .thread-nav, .inspector { display: none; }.directions { grid-template-columns: 1fr; }.state-ribbon { grid-template-columns: 1fr; }.conversation-layout, .canvas-layout { display: block; }.conversation { padding: 22px 16px 90px; }.mind-canvas { height: 100%; }.node { transform: scale(.82); transform-origin: top left; }.node.capacity { left: 0; }.node.scene { left: 4%; }.node.need-node { left: 27%; }.node.direction-a { right: -6%; }.node.direction-b { right: -7%; }.node.question { left: 31%; }.canvas-top { left: 16px; right: 16px; }.canvas-top h1 { font-size: 18px; } }
  </style>
</head>
<body>
  <div class="variant-kicker" id="variant-kicker">PROJECT COCKPIT · 思考驾驶舱</div>
  <main class="app" id="stage"></main>
  <nav id="variant-picker" aria-label="切换方案">
    <button type="button" data-variant="1" aria-pressed="true">1 工作台</button>
    <button type="button" data-variant="2" aria-pressed="false">2 对话</button>
    <button type="button" data-variant="3" aria-pressed="false">3 画布</button>
    <span class="hint">← → / 1 2 3</span>
  </nav>
  <script>
    const stage = document.querySelector('#stage');
    const names = ['工作台优先', '对话优先', '关系画布优先'];
    let current = Number(new URLSearchParams(location.search).get('v')) || 1;

    const topbar = () => `
      <header class="topbar">
        <div class="brand"><span class="logo">L</span> Lily · PM Workbench</div>
        <div class="crumb"><span>招聘智能体</span><span>›</span><strong>IM 接入</strong><span>›</span><span>方向研究</span></div>
      </header>`;

    function workbench() {
      return `${topbar()}<section class="workspace">
        <aside class="sidebar">
          <div class="smallcaps">WORKSPACE</div><div class="project-title">猎聘智能体平台</div>
          <div class="tree-row"><span class="tree-icon">⌂</span>工作空间总览 <span class="tree-meta">4</span></div>
          <div class="tree-label">PRODUCTS</div>

    function hydrateRunView() {
      const content = document.querySelector('#doc-content'); if (!content) return;

      document.querySelector('#start-run')?.addEventListener('click', () => showRunPhase(2));

    function showRunPhase(phase) {

      if (phase === 2) { content.innerHTML = `<div class="eyebrow"><span class="pill"><span class="dot"></span>Run 执行中</span><span>4 个研究包并行处理</span></div><h1>正在把需求拆成可验证的事实</h1><p class="lead">主 Agent 正在等待各个研究包返回；你可以查看过程，也可以随时让 Lily 调整范围。</p>${runRail(2)}<div class="plan-box"><div class="plan-head"><h3>并行研究 · 进行中</h3><small>已完成 1 / 4 · 用时 01:42</small></div><div class="plan-grid"><div class="agent-job"><b>现有能力与影响面</b><span>发现 5 项能力，2 个系统影响面</span><em>已完成 · 查看结果</em></div><div class="agent-job"><b>招聘场景与 IM 作用</b><span>已识别 3 / 6 个关键场景</span><em>执行中 · 查看发现</em></div><div class="agent-job"><b>平台能力与限制</b><span>飞书完成，企微正在读取</span><em>执行中 · 查看来源</em></div><div class="agent-job pending"><b>竞品与产品参考</b><span>等待平台范围确认</span><em>等待 · 调整范围</em></div></div><div class="plan-actions"><button class="primary" id="finish-run">模拟全部完成，进入汇总</button><button id="pause-run">暂停未完成任务</button></div></div><div class="synthesis-box"><h3>执行中你能看到什么</h3><p>任务状态、阶段进度、已返回的结论和证据；完整工具日志保持在展开层。</p></div></div>`; document.querySelector('#finish-run').addEventListener('click', () => showRunPhase(3)); document.querySelector('#pause-run').addEventListener('click', e => { e.target.textContent = '已暂停，可继续'; }); }
      if (phase === 3) { content.innerHTML = `<div class="eyebrow"><span class="pill"><span class="dot"></span>需要你的判断</span><span>并行研究已完成</span></div><h1>主 Agent 汇总了结果，也发现了分歧</h1><p class="lead">先区分事实、推断和未知，再决定是否进入 PRD。</p>${runRail(3)}<div class="plan-box"><div class="plan-head"><h3>汇总与红队质询</h3><small>4 个研究包 · 12 条证据</small></div><div class="synthesis-box"><h3>核心分歧</h3><p>场景 Agent 认为“远程派活”最高频；平台 Agent 认为“企业上下文读取”才是差异化。当前证据不足以合并为一个方向。</p></div><div class="agent-job" style="margin-top:10px"><b>主 Agent 判断</b><span>拆成“招聘任务入口”和“企业上下文入口”两个方向，带去和领导对齐；暂不生成最终 PRD。</span><em>待你确认</em></div><div class="plan-actions"><button class="primary" id="persist-run">确认判断，进入沉淀</button><button id="ask-run">追问：为什么拆成两个方向？</button></div></div>`; document.querySelector('#persist-run').addEventListener('click', () => showRunPhase(4)); document.querySelector('#ask-run').addEventListener('click', e => { e.textContent = '已在右侧 Lily 对话中生成追问'; }); }
      if (phase === 4) { content.innerHTML = `<div class="eyebrow"><span class="pill"><span class="dot"></span>Run 已完成</span><span>结果已写入当前项目</span></div><h1>这轮协作留下了可复用的判断</h1><p class="lead">研究过程结束，产出已经从聊天中分离为项目资产。</p>${runRail(4)}<div class="plan-box"><div class="plan-head"><h3>可沉淀产物</h3><small>IM 接入 / 研究阶段</small></div><div class="plan-grid"><div class="agent-job"><b>方向研究稿</b><span>事实、证据、未满足诉求、两个方向</span><em>准备保存</em></div><div class="agent-job"><b>领导沟通稿</b><span>背景、判断、待拍板问题</span><em>准备生成</em></div><div class="agent-job"><b>产品判断</b><span>IM 是入口还是上下文，取决于真实场景频率</span><em>长期沉淀</em></div><div class="agent-job"><b>待验证事项</b><span>跨端完成率、资料授权接受度</span><em>加入验证列表</em></div></div><div class="plan-actions"><button class="primary" id="save-done">保存全部产物</button></div></div>`; document.querySelector('#save-done').addEventListener('click', e => { e.textContent = '已保存到项目'; e.disabled = true; }); }
    }

    function bindInteractions() {
      document.querySelectorAll('.direction').forEach(card => card.addEventListener('click', () => { document.querySelectorAll('.direction').forEach(item => item.classList.remove('selected')); card.classList.add('selected'); }));
      document.querySelectorAll('.nav-item[data-section]').forEach(item => item.addEventListener('click', () => { document.querySelectorAll('.nav-item[data-section]').forEach(nav => nav.classList.remove('active')); item.classList.add('active'); }));
      document.querySelector('#collapse-agent')?.addEventListener('click', () => { document.querySelector('#agent-sidecar').classList.add('hidden'); });
      document.querySelector('#align-brief')?.addEventListener('click', () => document.querySelector('#agent-output').classList.add('show'));
      document.querySelector('#side-send')?.addEventListener('click', () => { const input = document.querySelector('#side-input'); const text = input.value.trim(); if (!text) return; const feed = document.querySelector('#side-chat'); const user = document.createElement('div'); user.className = 'chat-line user'; user.innerHTML = `<b>你</b>${text}`; const answer = document.createElement('div'); answer.className = 'chat-line'; answer.innerHTML = '<b>Lily</b>我会把这个问题挂到当前项目的研究稿里，并标记需要验证的事实与待拍板决策。'; feed.append(user, answer); input.value = ''; feed.scrollTop = feed.scrollHeight; });
      document.querySelectorAll('[data-chat-action]').forEach(button => button.addEventListener('click', () => {
        const copy = { state: '已补充：飞书、企微、钉钉、微信的发送、授权、数据读取限制已进入全量状态表。', directions: '已生成两个方向：招聘任务入口、企业上下文入口。下一步是比较成功指标与边界。', brief: '已生成沟通提纲：现状、未满足诉求、两个方向、三项需要拍板的问题。' }[button.dataset.chatAction];
        const msg = document.createElement('div'); msg.className = 'msg'; msg.innerHTML = `<div class="avatar">L</div><div class="bubble"><p>${copy}</p></div>`; document.querySelector('#conversation').append(msg); document.querySelector('#draft-next').textContent = button.dataset.chatAction === 'brief' ? '准备与领导对齐' : '把新结论合入方向研究稿'; msg.scrollIntoView({behavior:'smooth', block:'nearest'});
      }));
      const detail = { capacity: ['已有能力', 'Lily 招聘闭环', '职位、人才搜索、沟通和招聘看板已经形成主站闭环。IM 不应重复实现这一层。', '下一问：哪种轻量操作会显著缩短招聘推进时间？'], scene: ['招聘场景', 'IM 中的工作时刻', '需求临时进入、候选人状态变化、招聘负责人催进度，是 IM 的自然时刻。', '下一问：每个时刻对应什么信息密度和动作？'], need: ['未满足诉求', '任务与上下文不应断裂', '用户需要能在 IM 中推进招聘，而不是多一个只会聊天的入口。', '下一问：哪些任务可以在 IM 内闭环，哪些必须回主站？'], 'direction-a': ['方向 A', '招聘任务入口', 'IM 发起、查询进度、接收关键结果；主站继续承载批量筛选、编辑和高风险操作。', '待验证：跨端回主站的完成率与用户接受度。'], 'direction-b': ['方向 B', '企业上下文入口', '把取得授权的会议纪要、文档转为可追溯引用，降低需求理解损耗。', '待验证：资料权限模型与引用展示。'], question: ['待对齐', '平台与权限边界', '平台差异会决定功能可达性；不能用统一“连接器”掩盖能力和合规差异。', '需要领导拍板：首期平台、优先闭环、衡量指标。'] };
      document.querySelectorAll('.node').forEach(node => node.addEventListener('click', () => { const [type, title, text, next] = detail[node.dataset.node]; document.querySelectorAll('.node').forEach(item => item.classList.remove('selected')); node.classList.add('selected'); document.querySelector('#inspect-card').innerHTML = `<small>${type}</small><h3>${title}</h3><p>${text}</p><div class="inspect-list"><div><b>下一问</b>${next}</div></div>`; }));
    }
    document.querySelectorAll('#variant-picker button').forEach(button => button.addEventListener('click', () => { current = Number(button.dataset.variant); render(); }));
    document.addEventListener('keydown', event => { if (['1','2','3'].includes(event.key)) { current = Number(event.key); render(); } if (event.key === 'ArrowLeft') { current = current === 1 ? 3 : current - 1; render(); } if (event.key === 'ArrowRight') { current = current === 3 ? 1 : current + 1; render(); } });
    render();
  </script>
</body>
</html>
